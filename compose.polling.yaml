# Только development/evaluation, foreground. Не совмещать с webhook или другой копией бота.
name: cultural-plan-polling
services:
  app:
    image: ${CULTURAL_PLAN_IMAGE:-cultural-plan:local}
    build: {context: ., target: runtime}
    env_file: .env.public
    environment:
      APP_MODE: live
      APP_INGRESS: polling
      ADMISSION_MODE: PUBLIC
      DATABASE_PATH: /app/runtime/public.sqlite
      DATA_SNAPSHOT_PATH: /app/runtime/catalog/active.json
      MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token
      MAX_CONSUMER_PORT: ${MAX_CONSUMER_PORT:?Сначала создайте .env.public через compose.setup.yaml}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS_CONTAINER:-}
    command: [node, dist/scripts/start-polling.js]
    healthcheck: {disable: true}
    volumes:
      - public-data:/app/runtime
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:${MAX_CONSUMER_PORT:?Нужен порт своей identity}:${MAX_CONSUMER_PORT:?Нужен порт своей identity}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 20s
    restart: "no"
volumes:
  public-data:
