name: cultural-plan-demo
services:
  app:
    image: ${CULTURAL_PLAN_IMAGE:-cultural-plan:local}
    build:
      context: .
      target: runtime
      args:
        SOURCE_VERSION: ${SOURCE_VERSION:-local-unreviewed}
    environment:
      APP_MODE: local
      ADMISSION_MODE: PUBLIC
      APP_INGRESS: webhook
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/runtime/demo.sqlite
      FLOW_DATA_MODE: synthetic-test
      FLOW_TEST_CLOCK: '2030-04-05T06:00:00.000Z'
      DATA_SNAPSHOT_PATH: /app/synthetic-catalog.json
      MAX_WEBHOOK_SECRET: synthetic-test-secret-000000000000000000
    ports:
      - "127.0.0.1:${DEMO_PORT:-3000}:3000"
    volumes:
      - demo-data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 20s
    restart: "no"
volumes:
  demo-data:
