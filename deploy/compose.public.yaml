# Только на уже согласованном host. Не запускается локальным smoke.
name: maxbot-real-webhook
services:
  catalog-init:
    image: maxbot-real-webhook:reviewed
    build:
      context: ..
      target: runtime
      args:
        SOURCE_VERSION: ${SOURCE_VERSION:?Укажите commit исходного кода}
    command: [node, dist/scripts/catalog-prepare.js]
    environment: {FLOW_DATA_MODE: real}
    volumes: [webhook-data:/app/runtime]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {disable: true}
    user: "1000:1000"
    init: true
    restart: "no"
  app:
    image: maxbot-real-webhook:reviewed
    depends_on:
      catalog-init: {condition: service_completed_successfully}
    build:
      context: ..
      target: runtime
      args:
        SOURCE_VERSION: ${SOURCE_VERSION:?Укажите hash рассмотренного source manifest}
    environment:
      APP_MODE: live
      APP_INGRESS: webhook
      ADMISSION_MODE: PUBLIC
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/runtime/webhook.sqlite
      FLOW_DATA_MODE: real
      PUBLIC_DISPLAY: NOT_CLEARED
      DATA_SNAPSHOT_PATH: /app/runtime/catalog/active.json
      MAX_EXPECTED_BOT_ID: ${MAX_EXPECTED_BOT_ID:?Сначала закрепите identity через GET /me}
      MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token
      MAX_CONSUMER_PORT: ${MAX_CONSUMER_PORT:?Нужен порт своей identity из identity-init}
      MAX_WEBHOOK_SECRET_FILE: /run/secrets/max_webhook_secret
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Нужен одобренный HTTPS origin}
      PUBLIC_HOST: ${PUBLIC_HOST:?Нужен согласованный HTTPS hostname}
      LIVE_SCOPE_CONFIRMED: ${LIVE_SCOPE_CONFIRMED:?Нужна подтверждённая область доступа}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS_CONTAINER:-}
      LIVE_EXCLUSIVE_CONSUMER_CONFIRMED: ${LIVE_EXCLUSIVE_CONSUMER_CONFIRMED:-false}
      LIVE_SUBSCRIPTION_JOURNAL_DIR: /app/runtime/subscription-journal
    volumes:
      - webhook-data:/app/runtime
      - type: bind
        source: ${MAX_SECRETS_DIR:-../secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    ports: ["127.0.0.1:${MAX_CONSUMER_PORT:?Нужен порт своей identity}:${MAX_CONSUMER_PORT:?Нужен порт своей identity}"]
    user: "1000:1000"
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
  caddy:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Укажите согласованный домен}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите согласованный контакт оператора}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  webhook-data:
  caddy-data:
  caddy-config:
