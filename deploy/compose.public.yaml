# Только на уже согласованном host. Не запускается локальным smoke.
name: maxbot-stage4-client-test
services:
  app:
    image: maxbot-stage4:reviewed
    build:
      context: ..
      target: runtime
      args:
        SOURCE_VERSION: ${SOURCE_VERSION:?Укажите hash рассмотренного source manifest}
    environment:
      APP_MODE: live
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/runtime/client-test.sqlite
      FLOW_DATA_MODE: synthetic-test
      PUBLIC_DISPLAY: NOT_CLEARED
      DATA_SNAPSHOT_PATH: /app/fixtures/synthetic-client-test.json
      MAX_EXPECTED_BOT_ID: ${MAX_EXPECTED_BOT_ID:?Сначала закрепите identity через GET /me}
      MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token
      MAX_WEBHOOK_SECRET_FILE: /run/secrets/max_webhook_secret
      PUBLIC_BASE_URL: https://${PUBLIC_HOST}
      PROBE_TESTER_IDS: ${PROBE_TESTER_IDS:?Нужны consenting testers}
      LIVE_SCOPE_CONFIRMED: ${LIVE_SCOPE_CONFIRMED:?Нужна подтверждённая область доступа}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS_CONTAINER:-}
      LIVE_EXCLUSIVE_CONSUMER_CONFIRMED: ${LIVE_EXCLUSIVE_CONSUMER_CONFIRMED:-false}
      LIVE_SUBSCRIPTION_JOURNAL_DIR: /app/runtime/subscription-journal
    volumes:
      - client-test-data:/app/runtime
      - type: bind
        source: ${MAX_SECRETS_DIR:-../secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIVE_SNAPSHOT_PATH:?Нужен новый synthetic snapshot на фактическое время}
        target: /app/fixtures/synthetic-client-test.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
  caddy:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Укажите согласованный домен}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите согласованный контакт оператора}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  client-test-data:
  caddy-data:
  caddy-config:
